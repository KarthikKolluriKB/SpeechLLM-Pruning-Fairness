[project]
name = "speechllm-pruning-fairness"
version = "0.1.0"
description = "Demographic disparities under audio encoder pruning in SLAM-ASR speech LLMs"
readme = "README.md"
authors = [{ name = "KarthikKolluriKB" }]
requires-python = ">=3.10"
dependencies = [
    "blobfile>=3.1.0",
    "datasets>=4.0.0",
    "hf-xet>=1.1.9",
    "huggingface-hub[cli]>=0.34.4",
    "jiwer>=4.0.0",
    "librosa>=0.10.0",
    "numpy>=1.26.0",
    "omegaconf>=2.3.0",
    "openai-whisper>=20250625",
    "peft>=0.17.1",
    "protobuf>=6.32.0",
    "scipy>=1.15.3",
    "sentencepiece>=0.2.1",
    "soundfile>=0.13.1",
    "tiktoken>=0.11.0",
    "torch>=2.8.0",
    "tqdm>=4.66.0",
    "transformers>=4.55.4",
    "wandb>=0.21.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["datamodule", "models", "utils", "scoring"]
